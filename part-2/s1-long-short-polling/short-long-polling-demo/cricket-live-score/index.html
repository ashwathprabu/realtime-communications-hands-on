<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Score - Short Polling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-gray-900 text-white font-sans flex items-center justify-center min-vh-100 min-h-screen">
    <div class="max-w-md w-full p-8 bg-gray-800 rounded-3xl shadow-2xl border border-gray-700">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-blue-400">Live Match</h1>
            <div class="flex items-center space-x-2">
                <span class="w-2 h-2 bg-red-500 rounded-full pulse"></span>
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Live</span>
            </div>
        </div>

        <div class="text-center mb-8">
            <h2 class="text-lg text-gray-300 mb-1">IND vs AUS</h2>
            <p class="text-xs text-gray-500">2nd T20I - Sydney Cricket Ground</p>
        </div>

        <div class="flex justify-center items-end space-x-2 mb-8">
            <span id="score" class="text-6xl font-black tracking-tighter">0/0</span>
            <span id="overs" class="text-xl font-medium text-gray-400 mb-2">(0.0)</span>
        </div>

        <div class="bg-gray-900/50 rounded-2xl p-4 mb-6">
            <h3 class="text-xs font-semibold text-gray-500 uppercase mb-3">Latest Event</h3>
            <p id="event" class="text-sm text-gray-200">Match is about to start...</p>
        </div>

        <div class="flex justify-between text-xs text-gray-500 border-t border-gray-700 pt-6">
            <div>Polling Intensity: <span class="text-blue-400">High (5s)</span></div>
            <div id="last-update">Last update: --:--:--</div>
        </div>
    </div>

    <script>
        const scoreEl = document.getElementById('score');
        const oversEl = document.getElementById('overs');
        const eventEl = document.getElementById('event');
        const updateEl = document.getElementById('last-update');

        async function fetchScore() {
            try {
                console.log('Fetching score...');
                const response = await fetch('/api/score');
                const data = await response.json();

                scoreEl.innerText = data.score;
                oversEl.innerText = `(${data.overs})`;
                eventEl.innerText = data.event;
                updateEl.innerText = `Last update: ${new Date().toLocaleTimeString()}`;

                // Visual feedback
                scoreEl.classList.add('text-green-400');
                setTimeout(() => scoreEl.classList.remove('text-green-400'), 1000);

            } catch (error) {
                console.error('Error fetching score:', error);
            }
        }

        // Short Polling: Fetch every 5 seconds
        setInterval(fetchScore, 5000);

        // Initial fetch
        fetchScore();
    </script>
</body>

</html>
